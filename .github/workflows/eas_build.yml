name: CI

on:
  pull_request:
    branches: [main]

jobs:
  check:
    name: Lint and Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx expo lint

      - name: Expo Doctor
        run: npx expo-doctor

      - name: Verify bundle
        run: npx expo export --platform all